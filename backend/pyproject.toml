[project]
name = "outmate-backend"
version = "0.1.0"
description = "Outmate enrichment backend (FastAPI + PostgreSQL)"
requires-python = ">=3.13"  # developed on Python 3.13.5
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "httpx2==2.13.1",  # starlette TestClient transport (httpx stays for provider calls)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "."
